[project]
name = "africre8-ml"
version = "0.1.0"
description = "Offline synthetic data tooling for AfriCre8"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143,<1",
    "huggingface-hub>=1.3,<2",
    "numpy>=2.5,<3",
    "pydantic>=2.14,<3",
    "scikit-learn>=1.9,<2",
    "sentence-transformers>=6.1,<7",
    "uvicorn>=0.54,<1",
]

[tool.setuptools.packages.find]
include = ["africre8_ml*"]

[tool.unittest]
start-directory = "tests"
